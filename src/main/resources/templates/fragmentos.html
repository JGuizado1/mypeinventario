<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | MypeInventario'">MypeInventario</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside class="lateral" th:fragment="menu(activo)">
    <a class="marca" th:href="@{/}">MypeInventario</a>
    <p class="tienda-activa" th:if="${tienda != null}">
        <strong th:text="${tienda.nombre}">Mi tienda</strong>
        <a th:href="@{/tiendas}">Cambiar de tienda</a>
    </p>
    <nav aria-label="Principal">
        <a th:href="@{/}" th:classappend="${activo == 'inicio'} ? 'activo'">Inicio</a>
        <p class="nav-titulo">Operaciones</p>
        <a th:href="@{/ventas}" th:classappend="${activo == 'ventas'} ? 'activo'">Ventas</a>
        <a th:href="@{/compras}" th:classappend="${activo == 'compras'} ? 'activo'">Compras</a>
        <a th:href="@{/alertas}" th:classappend="${activo == 'alertas'} ? 'activo'">Alertas</a>
        <a th:href="@{/reportes}" th:classappend="${activo == 'reportes'} ? 'activo'">Reportes</a>
        <p class="nav-titulo">Inventario</p>
        <a th:href="@{/ajustes}" th:classappend="${activo == 'ajustes'} ? 'activo'">Ajustes de stock</a>
        <a th:href="@{/tomas}" th:classappend="${activo == 'tomas'} ? 'activo'">Toma de inventario</a>
        <p class="nav-titulo">Catálogo</p>
        <a th:href="@{/productos}" th:classappend="${activo == 'productos'} ? 'activo'">Productos</a>
        <a th:href="@{/catalogo}" th:classappend="${activo == 'catalogo'} ? 'activo'">Categorías y marcas</a>
        <p class="nav-titulo">Personas</p>
        <a th:href="@{/clientes}" th:classappend="${activo == 'clientes'} ? 'activo'">Clientes</a>
        <a th:href="@{/proveedores}" th:classappend="${activo == 'proveedores'} ? 'activo'">Proveedores</a>
        <p class="nav-titulo">Cuenta</p>
        <a th:href="@{/tiendas}" th:classappend="${activo == 'tiendas'} ? 'activo'">Mis tiendas</a>
    </nav>
    <div class="usuario" th:if="${usuario != null}">
        <span th:text="${usuario.nombre}">Nombre</span>
        <form method="post" th:action="@{/salir}">
            <button class="btn-enlace" type="submit">Salir</button>
        </form>
    </div>
</aside>
<!-- Un importe en soles con dos decimales, por ejemplo «S/ 1,234.50». -->
<span th:fragment="soles(valor)"
      th:text="'S/ ' + ${#numbers.formatDecimal(valor, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</span>
</body>
</html>
