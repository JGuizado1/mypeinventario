<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Inicio')}"></head>
<body>
<div class="marco">
    <aside th:replace="~{fragmentos :: menu('inicio')}"></aside>
    <main class="contenido">
        <div class="cabecera-pagina">
            <div>
                <h1 th:text="${resumen.tienda.nombre}">Moda Rosa</h1>
                <p class="ayuda" th:if="${resumen.tienda.direccion != null or resumen.tienda.galeria != null}">
                    <span th:text="${resumen.tienda.direccion}">Jr. Gamarra 450</span>
                    <span th:if="${resumen.tienda.direccion != null and resumen.tienda.galeria != null}">, </span>
                    <span th:text="${resumen.tienda.galeria}">Gamarra</span>
                </p>
            </div>
            <a class="btn btn-principal" th:href="@{/productos/nuevo}">Nuevo producto</a>
        </div>

        <dl class="libro">
            <div>
                <dt><a th:href="@{/productos}">Productos activos</a></dt>
                <dd th:text="${resumen.productosActivos}">0</dd>
            </div>
            <div>
                <dt><a th:href="@{/productos}">Variantes con poco stock</a></dt>
                <dd th:text="${resumen.variantesConStockBajo}"
                    th:classappend="${resumen.variantesConStockBajo > 0} ? 'atencion'">0</dd>
            </div>
            <div>
                <dt>Alertas por revisar</dt>
                <dd th:text="${resumen.alertasPendientes}"
                    th:classappend="${resumen.alertasPendientes > 0} ? 'atencion'">0</dd>
            </div>
        </dl>

        <p class="vacio" th:if="${resumen.productosActivos == 0}">
            Esta tienda aún no tiene productos. Registra el primero con «Nuevo producto».
        </p>
        <p class="aviso" th:if="${resumen.alertasPendientes > 0}"
           th:text="${resumen.alertasPendientes == 1 ? 'Hay 1 producto por reabastecer.' : 'Hay ' + resumen.alertasPendientes + ' productos por reabastecer.'}">
            Hay productos por reabastecer.
        </p>
    </main>
</div>
</body>
</html>
