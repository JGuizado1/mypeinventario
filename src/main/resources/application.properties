spring.application.name=mypeinventario

# Base de datos en memoria (se borra al apagar la aplicación)
spring.datasource.url=jdbc:h2:mem:mypeinventario
spring.datasource.username=sa
spring.datasource.password=

# JPA: las tablas se crean desde las entidades y se muestran las consultas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Sesión web: la cookie no viaja en envíos desde otros sitios (frena CSRF) y dura 30 minutos
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
